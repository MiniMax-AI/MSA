[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-msa"
version = "0.1.0"
description = "Training and inference kernels for MiniMax sparse attention"
requires-python = ">=3.10"
dependencies = [
    "nvidia-cutlass-dsl[cu13]>=4.5.2",
    "torch",
    "cuda-python>=13",
    "apache-tvm-ffi",
    "numpy",
    "packaging",
    "jinja2",
    "ninja",
    "typing-extensions",
]

[project.optional-dependencies]
test = ["pytest", "nvidia-ml-py", "tomli; python_version < '3.11'"]
flashinfer = ["flashinfer-python==0.6.17"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["training", "."]
include = ["msa_v1*", "datas*", "inference*"]
namespaces = false

[tool.setuptools.package-data]
datas = [
    "*.json",
    "inference/*.json",
    "inference/prefill_cases_v1/*.jsonl",
    "inference/*.md",
    "training/*.md",
    "training/real/*.json",
    "training/real/*.jsonl",
    "training/synthetic/*.json",
]
"inference.msa_v1.attention.decode.q8kv4" = [
    "csrc/api/*",
    "csrc/src/*",
    "csrc/templates/*",
    "csrc/include/sm100/common/*",
    "csrc/include/sm100/collective/*",
    "csrc/include/sm100/device/*",
    "csrc/include/sm100/kernel/*",
]
"inference.msa_v1.indexer.decode.q8kv4" = [
    "csrc/api/*",
    "csrc/templates/*",
    "csrc/include/sm100/common/*",
    "csrc/include/sm100/collective/*",
    "csrc/include/sm100/device/*",
    "csrc/include/sm100/kernel/*",
]
"inference.msa_v1.attention.prefill.q8kv4" = [
    "csrc/api/*",
    "csrc/templates/*",
    "csrc/include/sm100/common/*",
    "csrc/include/sm100/collective/*",
    "csrc/include/sm100/device/*",
    "csrc/include/sm100/kernel/*",
]
"inference.msa_v1.attention.prefill._common" = [
    "vendor_manifest.json",
]
"inference.msa_v1.indexer._common.topk_select" = [
    "csrc/api/*",
    "csrc/kernel/*",
    "csrc/kernel/m3/*",
]
"inference.dequant.nvfp4_to_fp8" = [
    "csrc/api/*",
    "csrc/src/*",
    "csrc/include/sm100/common/*",
    "csrc/include/sm100/collective/*",
    "csrc/include/sm100/device/*",
    "csrc/include/sm100/kernel/*",
]

[tool.pytest.ini_options]
pythonpath = ["training", "."]
testpaths = [
    "tests/test_package_layout.py",
    "tests/test_training_workloads.py",
    "tests/training/msa_v1/cute",
    "tests/inference",
]
markers = [
    "gpu: requires an SM100 or SM103 CUDA GPU",
    "acceptance: runs the real CP metadata kernel acceptance matrix",
    "performance: runs same-machine performance gates",
]
